      }

        darkMode: false,
        activeTab: 'itinerary',
        selectedDay: 'all',
        stayStatuses: {},
        dayNotes: {},
        checklist: DEFAULT_CHECKLIST

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Could not save localStorage:', e);
      }
    }

    // ============================================================================
    // UI HELPERS & TOAST
    // ============================================================================
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      msgEl.textContent = message;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function getStayStatus(stay) {
      return appState.stayStatuses[stay.id] || stay.defaultStatus;
    }

    function getCrewBadge(crewId) {
      const member = CREW_MEMBERS.find(c => c.id === crewId);
      if (!member) return '';
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">
        <span class="w-2 h-2 rounded-full ${member.color}"></span>
        ${member.name.split(' ')[0]}
      </span>`;
    }

    // ============================================================================
    // RENDER FUNCTIONS
    // ============================================================================
    function renderDayFilterBar() {
      const bar = document.getElementById('day-filter-bar');
      const isAll = appState.selectedDay === 'all';
      let html = `
        <button onclick="selectDay('all')" class="shrink-0 px-3 py-1 rounded-full text-xs font-semibold transition ${
          isAll
            ? 'bg-emerald-400 text-slate-950 shadow-sm'
            : 'bg-pounamu-700/80 text-pounamu-100 hover:bg-pounamu-700'
        }">All 11 Days</button>
      `;

      ITINERARY_DAYS.forEach(d => {
        const active = appState.selectedDay === d.day;
        const shortDate = d.date.split(', ')[1].replace(', 2026', '').replace(', 2027', '');
        html += `
          <button onclick="selectDay(${d.day})" class="shrink-0 px-3 py-1 rounded-full text-xs font-medium transition ${
            active
              ? 'bg-emerald-400 text-slate-950 font-semibold shadow-sm'
              : 'bg-pounamu-700/60 text-pounamu-100 hover:bg-pounamu-700'
          }">D${d.day} • ${shortDate}</button>
        `;
      });

      bar.innerHTML = html;
    }

    function renderItinerary() {
      const container = document.getElementById('tab-itinerary');
      const daysToShow = appState.selectedDay === 'all'
        ? ITINERARY_DAYS
        : ITINERARY_DAYS.filter(d => d.day === appState.selectedDay);

      container.innerHTML = daysToShow.map(d => {
        const stay = STAYS_DATA.find(s => s.id === d.stayId);
        const stayStatus = stay ? getStayStatus(stay) : null;
        const userNote = appState.dayNotes[d.day] || '';

        const stayBlock = stay ? `
          <div class="mt-3 p-3 rounded-xl bg-sand-100/80 dark:bg-slate-800/80 border border-sand-200 dark:border-slate-700/80">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Tonight's Stay</div>
                <div class="font-bold text-sm text-slate-900 dark:text-white mt-0.5">${stay.name}</div>
                <div class="text-xs text-slate-600 dark:text-slate-300">${stay.location}</div>
              </div>
              <span class="shrink-0 px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${
                stayStatus === 'booked'
                  ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300'
                  : 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300'
              }">
                ${stayStatus === 'booked' ? '✓ Booked' : '⏳ To Book'}
              </span>
            </div>
            <div class="mt-2.5 flex flex-wrap gap-1.5">
              ${stay.links.map(link => `
                <a href="${link.url}" target="_blank" rel="noopener noreferrer"
                   class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-900 text-pounamu-700 dark:text-emerald-400 border border-slate-200 dark:border-slate-700 hover:border-pounamu-500 transition">
                  <span>🔗 ${link.label}</span>
                </a>
              `).join('')}
            </div>
          </div>
        ` : `
          <div class="mt-3 p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/50 text-xs text-slate-600 dark:text-slate-300 flex items-center gap-2">
            <span>🏁</span>
            <span>Final day of trip — heading home to Wellington & Christchurch.</span>
          </div>
        `;

        return `
          <article class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800">
            <!-- Top Row: Day & Region -->
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-0.5 rounded-lg bg-pounamu-800 text-white text-xs font-bold">Day ${d.day}</span>
                <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">${d.date}</span>
              </div>
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${d.regionColor}">${d.region}</span>
            </div>

            <!-- Title & Summary -->
            <h2 class="font-bold text-base sm:text-lg text-slate-900 dark:text-white leading-snug">${d.title}</h2>
            <p class="text-sm text-slate-600 dark:text-slate-300 mt-1.5 leading-relaxed">${d.summary}</p>

            <!-- Crew Present -->
            <div class="mt-3 flex flex-wrap items-center gap-1.5">
              <span class="text-[11px] font-semibold text-slate-400 uppercase mr-0.5">Crew (${d.crew.length}):</span>
              ${d.crew.map(getCrewBadge).join('')}
            </div>

            <!-- Accommodation Card -->
            ${stayBlock}

            <!-- Expandable Offline Logistics & Personal Notes -->
            <details class="mt-3 group">
              <summary class="list-none cursor-pointer flex items-center justify-between text-xs font-semibold text-pounamu-700 dark:text-emerald-400 py-1.5 px-2.5 rounded-lg bg-pounamu-50/70 dark:bg-slate-800/60 hover:bg-pounamu-100/70 transition">
                <span>📋 Logistics & Personal Notes ${userNote ? '• (1 note saved)' : ''}</span>
                <span class="group-open:rotate-180 transition-transform">▾</span>
              </summary>
              <div class="mt-2.5 pl-1 space-y-2.5">
                <ul class="space-y-1.5 text-xs text-slate-600 dark:text-slate-300">
                  ${d.logistics.map(item => `
                    <li class="flex items-start gap-2">
                      <span class="text-pounamu-500 mt-0.5">•</span>
                      <span>${item}</span>
                    </li>
                  `).join('')}
                </ul>
                <div class="pt-1">
                  <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Offline Personal Note (saved on phone):</label>
                  <textarea
                    rows="2"
                    placeholder="Add offline reminder, confirmation code, or meeting spot..."
                    onchange="updateDayNote(${d.day}, this.value)"
                    class="w-full rounded-xl text-xs p-2.5 bg-sand-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-pounamu-500"
                  >${userNote}</textarea>
                </div>
              </div>
            </details>
          </article>
        `;
      }).join('');
    }

    function renderStays() {
      const container = document.getElementById('tab-stays');
      const bookedCount = STAYS_DATA.filter(s => getStayStatus(s) === 'booked').length;

      container.innerHTML = `
        <div class="bg-pounamu-800 text-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
          <div>
            <h2 class="font-bold text-base">Accommodation Directory</h2>
            <p class="text-xs text-pounamu-100 mt-0.5">${bookedCount} of ${STAYS_DATA.length} stays confirmed • Tap status to toggle</p>
          </div>
          <span class="text-2xl">🏡</span>
        </div>

        ${STAYS_DATA.map(stay => {
          const status = getStayStatus(stay);
          const isBooked = status === 'booked';
          return `
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <span class="text-xs font-bold text-pounamu-700 dark:text-emerald-400">${stay.dates}</span>
                  <h3 class="font-bold text-base text-slate-900 dark:text-white mt-0.5">${stay.name}</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">📍 ${stay.location} • 👥 ${stay.guests}</p>
                </div>
                <button onclick="toggleStayStatus('${stay.id}')"
                  class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold transition active:scale-95 ${
                    isBooked
                      ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-300 border border-emerald-300/60'
                      : 'bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-300 border border-amber-300/60'
                  }">
                  ${isBooked ? '✓ Booked' : '⏳ To Book'}
                </button>
              </div>

              <p class="text-xs text-slate-600 dark:text-slate-300 mt-2.5 leading-relaxed bg-sand-50 dark:bg-slate-800/60 p-2.5 rounded-xl">
                ${stay.notes}
              </p>

              <div class="mt-3 flex flex-wrap gap-2">
                ${stay.links.map(link => `
                  <a href="${link.url}" target="_blank" rel="noopener noreferrer"
                     class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold bg-pounamu-50 dark:bg-slate-800 text-pounamu-800 dark:text-emerald-400 hover:bg-pounamu-100 dark:hover:bg-slate-700 transition">
                    <span>🔗 ${link.label}</span>
                  </a>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    function renderTransportAndCrew() {
      const container = document.getElementById('tab-transport');

      container.innerHTML = `
        <!-- Ferries & Flights -->
        <div>
          <h2 class="font-bold text-base text-slate-900 dark:text-white mb-2.5 px-1">⛴️ Ferries & Flights Schedule</h2>
          <div class="space-y-2.5">
            ${TRANSPORT_SCHEDULE.map(item => `
              <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-start gap-3">
                <div class="w-10 h-10 rounded-xl bg-pounamu-50 dark:bg-slate-800 flex items-center justify-center text-xl shrink-0">
                  ${item.icon}
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-bold text-pounamu-700 dark:text-emerald-400">${item.date}</span>
                    <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800">${item.time}</span>
                  </div>
                  <div class="font-bold text-sm text-slate-900 dark:text-white mt-0.5">${item.route}</div>
                  <div class="text-xs font-medium text-slate-600 dark:text-slate-300 mt-0.5">👤 ${item.who}</div>
                  <div class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">${item.note}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Crew Presence Matrix -->
        <div>
          <h2 class="font-bold text-base text-slate-900 dark:text-white mb-2.5 px-1">👥 Crew Attendance Matrix</h2>
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-3 shadow-sm border border-slate-200/80 dark:border-slate-800 overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400">
                  <th class="py-2 pr-2 font-semibold sticky left-0 bg-white dark:bg-slate-900">Person</th>
                  ${ITINERARY_DAYS.map(d => `<th class="py-2 px-1.5 text-center font-semibold">D${d.day}<br><span class="text-[10px] font-normal">${d.date.split(' ')[2]}</span></th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800/80">
                ${CREW_MEMBERS.map(member => `
                  <tr>
                    <td class="py-2.5 pr-2 font-semibold whitespace-nowrap sticky left-0 bg-white dark:bg-slate-900">
                      <span class="inline-block w-2 h-2 rounded-full ${member.color} mr-1.5"></span>${member.name.split(' ')[0]}
                    </td>
                    ${ITINERARY_DAYS.map(d => {
                      const present = d.crew.includes(member.id);
                      return `<td class="py-2 px-1 text-center">
                        ${present
                          ? '<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 font-bold text-[11px]">✓</span>'
                          : '<span class="text-slate-300 dark:text-slate-700">—</span>'}
                      </td>`;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderChecklist() {
      const container = document.getElementById('tab-checklist');
      const total = appState.checklist.length;
      const done = appState.checklist.filter(i => i.done).length;
      const pct = total ? Math.round((done / total) * 100) : 0;

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-800">
          <div class="flex items-center justify-between mb-2">
            <div>
              <h2 class="font-bold text-base text-slate-900 dark:text-white">Offline Gear & Trip Prep</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">${done} of ${total} items ready (${pct}%)</p>
            </div>
            <button onclick="resetChecklist()" class="text-xs text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 underline">Reset</button>
          </div>
          <div class="w-full h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
            <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${pct}%"></div>
          </div>

          <!-- Add New Item Form -->
          <form onsubmit="addChecklistItem(event)" class="mt-4 flex gap-2">
            <input id="new-checklist-input" type="text" placeholder="Add gear or task (e.g., Headlamps, Sunscreen)..."
              class="flex-1 rounded-xl text-xs px-3 py-2.5 bg-sand-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-pounamu-500" />
            <button type="submit" class="px-4 py-2.5 rounded-xl bg-pounamu-800 hover:bg-pounamu-700 text-white text-xs font-semibold active:scale-95 transition">
              Add
            </button>
          </form>
        </div>

        <div class="space-y-2">
          ${appState.checklist.map(item => `
            <div class="bg-white dark:bg-slate-900 rounded-xl p-3 shadow-sm border border-slate-200/80 dark:border-slate-800 flex items-center justify-between gap-3">
              <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0">
                <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklist('${item.id}')"
                  class="w-5 h-5 rounded-md accent-emerald-600 cursor-pointer shrink-0" />
                <div class="min-w-0">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-pounamu-700 dark:text-emerald-400 block">${item.category}</span>
                  <span class="text-sm ${item.done ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100'}">${item.text}</span>
                </div>
              </label>
              <button onclick="deleteChecklist('${item.id}')" aria-label="Delete item" class="p-1.5 text-slate-400 hover:text-rose-500 transition text-xs">
                ✕
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ============================================================================
    // INTERACTIVE ACTIONS
    // ============================================================================
    window.selectDay = function(day) {
      appState.selectedDay = day;
      saveState();
      renderDayFilterBar();
      renderItinerary();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.updateDayNote = function(day, text) {
      appState.dayNotes[day] = text.trim();
      saveState();
      showToast(`Saved note for Day ${day}`);
    };

    window.toggleStayStatus = function(stayId) {
      const stay = STAYS_DATA.find(s => s.id === stayId);
      const current = getStayStatus(stay);
      const next = current === 'booked' ? 'pending' : 'booked';
      appState.stayStatuses[stayId] = next;
      saveState();
      renderStays();
      renderItinerary();
      showToast(`${stay.name}: marked as ${next === 'booked' ? 'Booked ✓' : 'To Book ⏳'}`);
    };

    window.toggleChecklist = function(id) {
      const item = appState.checklist.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        saveState();
        renderChecklist();
      }
    };

    window.addChecklistItem = function(e) {
      e.preventDefault();
      const input = document.getElementById('new-checklist-input');
      const val = input.value.trim();
      if (!val) return;
      appState.checklist.unshift({
        id: 'chk-' + Date.now(),
        category: 'Custom',
        text: val,
        done: false
      });
      input.value = '';
      saveState();
      renderChecklist();
      showToast('Added to offline checklist');
    };

    window.deleteChecklist = function(id) {
      appState.checklist = appState.checklist.filter(i => i.id !== id);
      saveState();
      renderChecklist();
    };

    window.resetChecklist = function() {
      appState.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
      saveState();
      renderChecklist();
      showToast('Checklist restored to defaults');
    };

    function switchTab(tabName) {
      appState.activeTab = tabName;
      saveState();

      ['itinerary', 'stays', 'transport', 'checklist'].forEach(t => {
        const sec = document.getElementById(`tab-${t}`);
        if (t === tabName) sec.classList.remove('hidden');
        else sec.classList.add('hidden');
      });

      const filterBar = document.getElementById('day-filter-bar');
      if (tabName === 'itinerary') filterBar.classList.remove('hidden');
      else filterBar.classList.add('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.classList.remove('text-slate-500', 'dark:text-slate-400', 'font-medium');
          btn.classList.add('text-pounamu-700', 'dark:text-emerald-400', 'font-semibold');
        } else {
          btn.classList.remove('text-pounamu-700', 'dark:text-emerald-400', 'font-semibold');
          btn.classList.add('text-slate-500', 'dark:text-slate-400', 'font-medium');
        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================================
    // DARK MODE & STANDALONE OFFLINE HTML EXPORT
    // ============================================================================
    function applyTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (appState.darkMode) {
        html.classList.add('dark');
        icon.textContent = '☀️';
      } else {
        html.classList.remove('dark');
        icon.textContent = '🌙';
      }
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      appState.darkMode = !appState.darkMode;
      saveState();
      applyTheme();
    });

    document.getElementById('download-offline-btn').addEventListener('click', () => {
      try {
        const docContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([docContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'NZ-Trip-2027-Offline.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded NZ-Trip-2027-Offline.html!');
      } catch (err) {
        showToast('Use browser Share / Save Page to store offline');
      }
    });

    // Bottom Navigation Listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // Inline Service Worker Registration for Offline Caching when hosted on GitHub Pages
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      const swCode = `
        const CACHE_NAME = 'nz-trip-2027-v1';
        self.addEventListener('install', event => {
          event.waitUntil(
            caches.open(CACHE_NAME).then(cache => cache.addAll([self.location.href]))
          );
          self.skipWaiting();
        });
        self.addEventListener('fetch', event => {
          event.respondWith(
            caches.match(event.request).then(cached => cached || fetch(event.request).then(resp => {
              const copy = resp.clone();
              caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));
              return resp;
            }).catch(() => cached))
          );
        });
      `;
      try {
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      } catch (e) {}
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      renderDayFilterBar();
      renderItinerary();
      renderStays();
      renderTransportAndCrew();
      renderChecklist();
      switchTab(appState.activeTab || 'itinerary');
    });
  </script>
</body>
</html>
