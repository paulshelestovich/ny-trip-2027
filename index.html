    const STORAGE_KEY = 'nz_trip_2027_state_v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn('Could not read localStorage:', e);
      }
      return {
        darkMode: false,
        activeTab: 'itinerary',
        selectedDay: 'all',
        stayStatuses: {},
        dayNotes: {},
        checklist: DEFAULT_CHECKLIST
      };
    }

    let appState = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Could not save localStorage:', e);
      }
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      msgEl.textContent = message;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function getStayStatus(stay) {
      return appState.stayStatuses[stay.id] || stay.defaultStatus;

      const member = CREW_MEMBERS.find(c => c.id === crewId);

        <span class="w-2 h-2 rounded-full ${member.color}"></span>

      </span>`;
    }

              <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0">
                <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleChecklist('${item.id}')"
                  class="w-5 h-5 rounded-md accent-emerald-600 cursor-pointer shrink-0" />
                <div class="min-w-0">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-pounamu-700 dark:text-emerald-400 block">${item.category}</span>
                  <span class="text-sm ${item.done ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100'}">${item.text}</span>
                </div>
              </label>
              <button onclick="deleteChecklist('${item.id}')" aria-label="Delete item" class="p-1.5 text-slate-400 hover:text-rose-500 transition text-xs">
                ✕
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ============================================================================
    // INTERACTIVE ACTIONS
    // ============================================================================
    window.selectDay = function(day) {
      appState.selectedDay = day;
      saveState();
      renderDayFilterBar();
      renderItinerary();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.updateDayNote = function(day, text) {
      appState.dayNotes[day] = text.trim();
      saveState();
      showToast(`Saved note for Day ${day}`);
    };

    window.toggleStayStatus = function(stayId) {
      const stay = STAYS_DATA.find(s => s.id === stayId);
      const current = getStayStatus(stay);
      const next = current === 'booked' ? 'pending' : 'booked';
      appState.stayStatuses[stayId] = next;
      saveState();
      renderStays();
      renderItinerary();
      showToast(`${stay.name}: marked as ${next === 'booked' ? 'Booked ✓' : 'To Book ⏳'}`);
    };

    window.toggleChecklist = function(id) {
      const item = appState.checklist.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        saveState();
        renderChecklist();
      }
    };

    window.addChecklistItem = function(e) {
      e.preventDefault();
      const input = document.getElementById('new-checklist-input');
      const val = input.value.trim();
      if (!val) return;
      appState.checklist.unshift({
        id: 'chk-' + Date.now(),
        category: 'Custom',
        text: val,
        done: false
      });
      input.value = '';
      saveState();
      renderChecklist();
      showToast('Added to offline checklist');
    };

    window.deleteChecklist = function(id) {
      appState.checklist = appState.checklist.filter(i => i.id !== id);
      saveState();
      renderChecklist();
    };

    window.resetChecklist = function() {
      appState.checklist = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST));
      saveState();
      renderChecklist();
      showToast('Checklist restored to defaults');
    };

    function switchTab(tabName) {
      appState.activeTab = tabName;
      saveState();

      ['itinerary', 'stays', 'transport', 'checklist'].forEach(t => {
        const sec = document.getElementById(`tab-${t}`);
        if (t === tabName) sec.classList.remove('hidden');
        else sec.classList.add('hidden');
      });

      const filterBar = document.getElementById('day-filter-bar');
      if (tabName === 'itinerary') filterBar.classList.remove('hidden');
      else filterBar.classList.add('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.classList.remove('text-slate-500', 'dark:text-slate-400', 'font-medium');
          btn.classList.add('text-pounamu-700', 'dark:text-emerald-400', 'font-semibold');
        } else {
          btn.classList.remove('text-pounamu-700', 'dark:text-emerald-400', 'font-semibold');
          btn.classList.add('text-slate-500', 'dark:text-slate-400', 'font-medium');
        }
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================================
    // DARK MODE & STANDALONE OFFLINE HTML EXPORT
    // ============================================================================
    function applyTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (appState.darkMode) {
        html.classList.add('dark');
        icon.textContent = '☀️';
      } else {
        html.classList.remove('dark');
        icon.textContent = '🌙';
      }
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      appState.darkMode = !appState.darkMode;
      saveState();
      applyTheme();
    });

    document.getElementById('download-offline-btn').addEventListener('click', () => {
      try {
        const docContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([docContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'NZ-Trip-2027-Offline.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Downloaded NZ-Trip-2027-Offline.html!');
      } catch (err) {
        showToast('Use browser Share / Save Page to store offline');
      }
    });

    // Bottom Navigation Listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // Service Worker (real file, cached shell works fully offline)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('/ny-trip-2027/sw.js', { scope: '/ny-trip-2027/' }).catch(() => {});
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      renderDayFilterBar();
      renderItinerary();
      renderStays();
      renderTransportAndCrew();
      renderChecklist();
      switchTab(appState.activeTab || 'itinerary');
    });
  </script>
</body>
</html>
